<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registration Form</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="card p-4 shadow">
    <h3 class="text-center mb-3">Registration Form</h3>

    <form id="regForm">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" id="name" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="text" class="form-control" id="phone" required>
      </div>

      <div class="mb-3">
        <label class="form-label">City</label>
        <input type="text" class="form-control" id="city" required>
      </div>

      <button class="btn btn-primary w-100" type="submit">Submit</button>

      <p id="msg" class="text-success mt-2" style="display:none;">Data submitted successfully ✅</p>
    </form>
  </div>
</div>
<script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbzjPDpEMBJPSBaVV5Yonvci5ZoVnNt2lP5WOwAhAJVK9o_Dfwb_0wyOCQgtn1tJTzuN/exec";
    
    fetch("https://script.google.com/macros/s/AKfycbzjPDpEMBJPSBaVV5Yonvci5ZoVnNt2lP5WOwAhAJVK9o_Dfwb_0wyOCQgtn1tJTzuN/exec", {
  method: "POST",
  headers: {"Content-Type": "application/json"},
  body: JSON.stringify({
    name: "Test",
    email: "test@test.com",
    phone: "123456",
    city: "Test City"
  })
})
.then(r => r.text())
.then(console.log)
.catch(console.error);





    document.getElementById("regForm").addEventListener("submit", function(e){
      e.preventDefault();
    
      let formData = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        city: document.getElementById("city").value
      };
    
      fetch(scriptURL, {
        method: 'POST',
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(formData)
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("msg").style.display = "block";
        document.getElementById("regForm").reset();
      })
      .catch(err => alert("Error: " + err));
    });
    </script>
    

</body>
</html>
